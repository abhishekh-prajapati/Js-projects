<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather api</title>
  </head>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(to top, #87ceeb, #e0f6ff);
  overflow: hidden;
}

/* SKY ELEMENTS */
body::before {
  content: "";
  position: absolute;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, #ffd93b, #ffb700);
  border-radius: 50%;
  top: 60px;
  right: 100px;
  box-shadow: 0 0 60px rgba(255, 217, 59, 0.8);
  animation: sunFloat 6s ease-in-out infinite;
}

body::after {
  content: "";
  position: absolute;
  width: 80px;
  height: 80px;
  background: radial-gradient(circle, #f5f3ce, #cfcdb8);
  border-radius: 50%;
  top: 90px;
  left: 80px;
  opacity: 0.2;
}

/* Sun animation */
@keyframes sunFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

/* MAIN CARD */
.main {
  position: relative;
  width: 380px;
  padding: 30px;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(14px);
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
  z-index: 1;
}

/* SEARCH */
.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.search-box input {
  flex: 1;
  padding: 12px 15px;
  border-radius: 12px;
  border: none;
  outline: none;
  font-size: 15px;
}

.search-box button {
  padding: 12px 18px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #ffcc00, #ff9900);
  color: #000;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

.search-box button:hover {
  transform: scale(1.07);
}

/* WEATHER INFO */
#para {
  text-align: center;
  margin-top: 25px;
}

#para h1 {
  font-size: 52px;
  font-weight: 600;
}

#para h2 {
  font-size: 20px;
  margin-top: 6px;
}

#para p {
  font-size: 14px;
  opacity: 0.8;
}

/* MESSAGE */
#msg {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  color: #d60000;
}


  </style>

  <body>
    <div class="main">
      <div class="search-box">
        <input type="text" id="input" placeholder="Write your city name" />
        <button id="searchBtn">Search</button>
      </div>

      <div id="para"></div>
      <p id="msg"></p>
    </div>
  </body>

  <script>
    let input = document.getElementById("input");
    let btn = document.getElementById("searchBtn");
    let para = document.getElementById("para");
    let msg = document.getElementById("msg");

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        btn.click();
      }
    });

    btn.addEventListener("click", async function getWeather() {
      let city = input.value.trim();

      if (city === "") {
        msg.innerText = "Please enter city name";
        para.innerText = "";
        return;
      }

      msg.innerText = "Loading...";
      para.innerText = "";

      try {
        let response = await fetch(
          `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=7a057afb1e97d8859394c7ddf70d9046`
        );

        let data = await response.json();

        if (data.cod !== 200) {
          msg.innerText = "city is not found";
          para.innerText = "";
          return;
        }

        let cityName = data.name;
        let tempKelvin = data.main.temp;
        let tempCelsius = (tempKelvin - 273.15).toFixed(1);
        let description = data.weather[0].description;
        let humidity = data.main.humidity;
        let windSpeed = data.wind.speed;

        para.innerHTML = `
  <strong>${cityName}</strong><br>
  Temperature: ${tempCelsius} °C<br>
  Weather: ${description}<br>
  Humidity: ${humidity}%
`;
        msg.innerText = "";
      } catch (error) {
        console.error(error);
        msg.innerText = "Network error. Check console.";
        para.innerText = "";
      }
    });
  </script>
</html>
