<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: #fff;
        color: black;;
        align-items: center;
        justify-items: center;
        height:100vh;

    }
    body.dark{
        background-color: #20223cff;
        color: white;
    }
    h2{
        color: rgb(255, 140, 0);
        font-family: serif;
        text-align: center;

}
#dark{
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 10px;
    background-color:rgba(245, 183, 49, 1);
    color: rgb(0, 0, 0);
    border: none;
    font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}
#submit{
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 10px;
    background-color:rgba(171, 171, 237, 1);
    color: white;
    border: none;
    font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}
#input{
    padding: 10px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid black;
    font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    width: 200px;
    }
    #box{
        margin: 20px;
        border: 2px solid black;
        border-radius: 10px;
        padding: 10px;
        width: 300px;
        min-height: 200px;
        font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
.sag{
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;

}
.todo{
    padding: 10px;
    margin: 10px;
    gap: 10px;
    border-bottom: 1px solid rgb(255, 255, 255);
    cursor: pointer;
    border: none;
    font-size: 40px;
}

</style>
<body>
    <h2>TODO LIST</h2>
    <div class="sag">
    <button id="dark">Dark</button>
    <input type="text" id="input" placeholder="add your todo">
    <button id="submit">Submit</button></div>
    <div id="box">
    </div>
</body>
<script>
    let input = document.getElementById("input");
    let box = document.getElementById("box");
    let submit = document.getElementById("submit");
    let darkl = document.getElementById("dark");

    darkl.addEventListener("click", function(){
     document.body.classList.toggle("dark");

     if (document.body.classList.contains("dark")){
        darkl.innerText = "Light";
     }else {
        darkl.innerText = "Dark";
     }
   });  

    submit.addEventListener("click", function(event) {
        let todo = document.createElement("div");
        todo.style.backgroundColor = "rgba(178, 245, 166, 1)";
        todo.style.margin = "10px";
        todo.style.borderColor = "transparent";
        todo.innerText = input.value;
        box.appendChild(todo);
        event.preventDefault();
   

    todo.addEventListener("click", function(){
      todo.remove();  
    })
 });
   
</script>
</html>
