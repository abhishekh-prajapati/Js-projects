<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    *{
        margin: 10px;padding: 10px;
    }
    body{
        display: flex;
       align-items: center;
        justify-content: center;
        height:100vh;
    }
    #body{
         align-items: center;
        justify-content: center;
    }
    body.dark{
        background-color: rgb(35, 35, 59);
        color: white;
    }
    #togglebtn {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 10px;
        background-color:rgba(171, 171, 237, 1);
        color: white;
        
    }
    h2{
        text-align: center;
    }
</style>
<body>
   <div id="body"> <h2>
        This is the toggle which switches the into Dark mode and Light mode
    </h2>
    <p>we are going to try to use classList in this which will make this more bettr and clean code as i have listen that this is the easiest way to do this </p>
    <button id="togglebtn">Darkmode</button></div>
</body>
<script>
let togglebtn = document.getElementById("togglebtn");

    togglebtn.addEventListener("click", function(){
        document.body.classList.toggle("dark");
        if(document.body.classList.contains("dark")){
            togglebtn.innerText = "lightmode";
        }
        else{
            togglebtn.innerText = "Darkmode";
        }
    })
</script>
</html>
