<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    p {
      width: 200px;
    }
  </style>
  <body>
    <input type="text" placeholder="Enter you Name" id="name" />
    <button id="submit">Submit</button>
    <p id="output"></p>
  </body>
  <script>
    let name = document.getElementById("name");
    let submit = document.getElementById("submit");
    let output = document.getElementById("output");
    
    let saved = JSON.parse(localStorage.getItem("username"));
    if (saved !== null) {
      output.innerText = saved;
      
    submit.addEventListener("click", function () {
      output.innerText = name.value;
      localStorage.setItem("username", JSON.stringify(name.value));
    });

      name.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          output.innerText = name.value;
          localStorage.setItem("username", JSON.stringify(name.value));
        }
      });
    }
  </script>
</html>
